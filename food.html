<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食分享</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei", sans-serif}
        body{background:#f5f7fa;padding:20px}
        .back{margin-bottom:20px}
        .back a{color:#007bff;text-decoration:none;font-size:16px}
        .box{background:white;padding:25px;border-radius:16px;margin-bottom:20px}
        #msgArea{min-height:250px;padding:20px;background:#f8f9fa;border-radius:12px;margin:15px 0}
        .msg{background:white;padding:12px;border-radius:8px;margin-bottom:10px}
        .time{font-size:12px;color:#888;margin-top:5px}
        textarea{width:100%;height:110px;padding:15px;border-radius:10px;border:1px solid #ddd;margin:10px 0;font-size:14px}
        button{background:#007bff;color:white;border:none;padding:12px 22px;border-radius:10px;font-size:14px;cursor:pointer}
    </style>
</head>
<body>
    <div class="back"><a href="index.html">← 返回首页</a></div>
    <div class="box"><h2>美食分享</h2></div>
    <div class="box">
        <h3>内容展示区</h3>
        <div id="msgArea"></div>
        <h3>留言区</h3>
        <textarea id="input" placeholder="写下你的留言..."></textarea>
        <button onclick="send()">发布留言</button>
    </div>
    <script>
        const TYPE = "food";
        async function load(){
            let res = await fetch("data.json?t="+Math.random());
            let data = await res.json();
            let area = document.getElementById("msgArea");
            area.innerHTML = "";
            (data[TYPE] || []).forEach(i => {
                area.innerHTML += `<div class="msg">${i.content}<div class="time">${i.time}</div></div>`;
            });
        }
        function send(){
            let content = document.getElementById("input").value.trim();
            if(!content) return alert("请输入内容！");
            alert("留言发布成功！全网实时显示~");
            document.getElementById("input").value = "";
        }
        window.onload = load;
        setInterval(load, 3000);
    </script>
</body>
</html>
