<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八卦分享</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
body{background:#f5f7fa;padding:20px}
.back{margin-bottom:15px}
.back a{color:#007bff}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:20px}
#msgList{padding:15px;background:#f8f9fa;border-radius:12px;min-height:200px;margin:10px 0}
.msg{background:white;padding:10px;border-radius:8px;margin-bottom:8px}
.time{font-size:12px;color:#888;margin-top:5px}
textarea{width:100%;height:100px;padding:12px;border-radius:8px;margin:10px 0}
button{background:#007bff;color:white;border:none;padding:10px 20px;border-radius:8px}
</style>
</head>
<body>
<div class="back"><a href="index.html">← 返回首页</a></div>
<div class="card"><h2>八卦分享</h2></div>
<div class="card">
<h3>内容展示区</h3>
<div id="msgList"></div>
<h3>留言区</h3>
<textarea id="content" placeholder="输入留言..."></textarea>
<button onclick="post()">发布留言（自动保存+实时显示）</button>
</div>
<script>
const API = "https://api.b0cm.cn/share";
const TYPE = "bagua";
async function load(){
  let res = await fetch(API+"?type="+TYPE+"&t="+Math.random());
  let list = await res.json();
  let html = "";
  list.forEach(i=>{
    html+=`<div class="msg">${i.content}<div class="time">${i.time}</div></div>`;
  });
  document.getElementById("msgList").innerHTML = html;
}
async function post(){
  let content = document.getElementById("content").value.trim();
  if(!content)return alert("请输入内容！");
  await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:TYPE,content})});
  alert("发布成功！实时显示！");
  document.getElementById("content").value="";
  load();
}
window.onload=load;
setInterval(load,3000);
</script>
</body>
</html>
