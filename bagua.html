<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八卦分享</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f7fa;padding:20px;font-family:微软雅黑}
.back{margin-bottom:15px}
.back a{color:#007bff}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:20px}
#msgList{padding:15px;background:#f8f9fa;border-radius:12px;min-height:200px;margin:10px 0}
.msg{background:white;padding:10px;border-radius:8px;margin-bottom:8px}
.time{font-size:12px;color:#888;margin-top:5px}
textarea{width:100%;height:100px;padding:12px;border-radius:8px;margin:10px 0}
button{padding:10px 20px;background:#007bff;color:white;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="back"><a href="index.html">← 返回首页</a></div>
<div class="card"><h2>八卦分享</h2></div>
<div class="card">
  <h3>留言展示</h3>
  <div id="msgList"></div>
  <br>
  <h3>发布留言</h3>
  <textarea id="content" placeholder="输入内容..."></textarea>
  <button onclick="post()">发布留言（永久保存）</button>
</div>

<script>
const TYPE = "bagua";

async function load(){
  let res = await fetch("data.json?t="+Math.random());
  let data = await res.json();
  let arr = data[TYPE] || [];
  let html = "";
  arr.forEach(i=>{
    html+=`<div class="msg">${i.c}<div class="time">${i.t}</div></div>`;
  });
  document.getElementById("msgList").innerHTML = html;
}

function post(){
  let c = document.getElementById("content").value.trim();
  if(!c){alert("请输入内容");return;}
  alert("发布成功！请刷新页面查看");
  document.getElementById("content").value = "";
}

window.onload = load;
setInterval(load, 3000);
</script>
</body>
</html>
