<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的摸鱼八卦分享屋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #f6f8fa;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .desc {
            color: #666;
            font-size: 16px;
        }

        .nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .nav button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 15px;
        }

        .nav button.active {
            background: #4a90e2;
            color: white;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .card p {
            color: #555;
            line-height: 1.6;
        }

        .comment-box {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            resize: none;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .comment-list {
            margin-top: 20px;
        }

        .comment-item {
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">🎉 我的摸鱼八卦分享屋</div>
            <div class="desc">一起聊天、八卦、晒美食、看风景～</div>
        </header>

        <div class="nav">
            <button class="active" data-tab="all">全部</button>
            <button data-tab="moyu">摸鱼</button>
            <button data-tab="bagua">八卦</button>
            <button data-tab="meishi">美食</button>
            <button data-tab="fengjing">风景</button>
        </div>

        <div id="content">
            <div class="card" data-type="moyu">
                <h3>🐟 摸鱼专区</h3>
                <p>上班偷偷摸鱼，下班快乐起飞～欢迎分享你的摸鱼小技巧！</p>
            </div>
            <div class="card" data-type="bagua">
                <h3>🍉 吃瓜八卦</h3>
                <p>快乐吃瓜，理性聊天，分享身边有趣的小故事～</p>
            </div>
            <div class="card" data-type="meishi">
                <h3>🍔 美食探店</h3>
                <p>好吃的永远最治愈！晒出你吃过的美味～</p>
            </div>
            <div class="card" data-type="fengjing">
                <h3>🌿 治愈风景</h3>
                <p>天空、晚霞、海边、山林，用风景治愈心情～</p>
            </div>
        </div>

        <div class="comment-box">
            <h3>💬 留言讨论</h3>
            <textarea id="contentInput" placeholder="说点什么吧～"></textarea>
            <button class="submit-btn" onclick="addComment()">发布留言</button>
            <div class="comment-list" id="commentList"></div>
        </div>
    </div>

    <script>
        // 标签切换
        const tabs = document.querySelectorAll('.nav button');
        const cards = document.querySelectorAll('.card');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                tab.classList.add('active');
                const type = tab.dataset.tab;
                cards.forEach(card => {
                    if (type === 'all' || card.dataset.type === type) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // 留言功能
        function addComment() {
            const input = document.getElementById('contentInput');
            const text = input.value.trim();
            if (!text) return;
            const list = document.getElementById('commentList');
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerText = text;
            list.appendChild(item);
            input.value = '';
        }
    </script>
</body>
</html>
